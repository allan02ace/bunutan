#app{max-width:680px;margin:0 auto;padding:0 20px 56px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 18px}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none}
.brand svg{flex:none}
.brand b{display:block;font-size:13px;letter-spacing:.42em;text-transform:uppercase;font-weight:600;line-height:1.25}
.brand small{display:block;font-size:8px;letter-spacing:.34em;text-transform:uppercase;color:var(--mut)}
.nav .r{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.nav img{width:26px;height:26px;border-radius:50%}
.nl{font:700 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.nl:hover{color:var(--gold)}
h1{font:500 clamp(34px,7vw,46px)/1.05 var(--serif);margin:0}
h2{margin:0 0 10px;font:700 11.5px/1.3 var(--sans);letter-spacing:.16em;text-transform:uppercase}
header{margin:14px 0 22px}
header .mut{margin-top:6px;letter-spacing:.08em;text-transform:uppercase;font-size:11.5px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:20px;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:13px 8px;border:1px solid var(--line);background:transparent;color:var(--mut);font:700 11px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;border-radius:2px;cursor:pointer}
.tab.on{background:#efe7d0;color:#17301f;border-color:#efe7d0}
button.btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.7);border-radius:2px;padding:15px 28px;font:700 11.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:background .15s}
button.btn:hover{background:rgba(255,255,255,.12)}
button.btn.fill{background:#efe7d0;border-color:#efe7d0;color:#17301f}
button.btn.fill:hover{background:#fff}
button.btn.ghost{border-color:var(--line);color:rgba(255,255,255,.82)}
button.btn.sm{padding:10px 14px;font-size:10.5px}
button.btn.danger{background:#891515;border-color:#891515;color:#fff}
label{display:block;font:700 10.5px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;margin:16px 0 6px;color:var(--mut)}
input,textarea{width:100%;padding:12px 13px;border-radius:2px;border:1px solid rgba(255,255,255,.2);background:var(--field);color:var(--ink);font:inherit}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.38)}
input:focus,textarea:focus{outline:none;border-color:rgba(255,255,255,.65)}
textarea{min-height:140px;resize:vertical}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.name{padding:14px 12px;border-radius:2px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.name:hover{border-color:rgba(255,255,255,.5)}
.name.sel{border-color:var(--gold);outline:1px solid var(--gold)}
.name.off{opacity:.4;cursor:default;text-decoration:line-through}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .g{flex:1;min-width:0;word-break:break-word}
.row .gift{font-weight:700;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:2px;padding:4px 12px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:14px 8px;text-align:center}
.stat b{display:block;font:500 34px/1.1 var(--serif)}
.stat .mut{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.big{font:500 clamp(40px,10vw,58px)/1.05 var(--serif);text-align:center;margin:10px 0;color:var(--gold);word-break:break-word}
.center{text-align:center}
.eye{background:none;border:0;color:var(--mut);cursor:pointer;padding:6px;border-radius:2px;display:flex}
.eye:hover{color:var(--ink)}
.msg{background:rgba(0,0,0,.28);border-left:3px solid var(--gold);padding:12px 14px;margin-bottom:14px;font-size:14px}
.bar{height:6px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.lk{display:flex;gap:8px;margin-bottom:8px}
pre{background:rgba(0,0,0,.3);padding:12px;border-radius:2px;overflow:auto;font-size:13px}
a{color:var(--gold)}
.hero{position:relative;margin:22px 0 8px;min-height:440px}
.hero .panel{position:absolute;left:11%;right:0;top:0;bottom:0;background:rgba(71,95,89,.66);border:1px solid rgba(255,255,255,.06)}
.hero .txt{position:relative;padding:52px 18px 48px 4%}
.hero h1{font-size:clamp(46px,13vw,80px);line-height:1}
.hero p{max-width:30ch;margin:22px 0 30px;color:#dfe8e3}
.hero .gicon{margin-right:12px;vertical-align:-5px}
.chat{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.bub{max-width:84%;align-self:flex-start;padding:9px 12px;border:1px solid var(--line);background:rgba(0,0,0,.22);border-radius:2px;word-break:break-word;font-size:15px}
.bub.me{align-self:flex-end;background:#efe7d0;color:#17301f;border-color:#efe7d0}
.bl{font:700 9.5px/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;opacity:.7;margin-bottom:3px}
.shake{display:inline-block;animation:shake .35s infinite}
@keyframes shake{0%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}100%{transform:rotate(-6deg)}}
.spin{animation:pulse .25s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.05)}}
@media (max-width:520px){.nl.nm{display:none}}
</style>
</head>

async function callRaw(method, path, body){
  const t = await auth.currentUser.getIdToken();
  const r = await fetch(DB_URL + '/' + path + '.json?auth=' + encodeURIComponent(t), {method, body: body === undefined ? undefined : JSON.stringify(body)});
  if (!r.ok) throw new Error('db ' + r.status);
  return r.json();
}

/* ---------- drum roll (Web Audio, no files needed) ---------- */
function drumRoll(ms){
  const AC = window.AudioContext || window.webkitAudioContext;
  const none = {stop(){}};
  if (!soundOn || !AC) return none;
  let ctx; try { ctx = new AC(); } catch(e){ return none; }
  if (ctx.resume) ctx.resume();
  const sr = ctx.sampleRate, buf = ctx.createBuffer(1, sr * 2, sr), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination);
  const now = ctx.currentTime + 0.05, dur = ms / 1000;
  const tap = (at, vol) => {
    const s = ctx.createBufferSource(); s.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500 + Math.random() * 700; bp.Q.value = 0.8;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + 0.09);
    s.connect(bp); bp.connect(g); g.connect(master); s.start(at, Math.random() * 1.5); s.stop(at + 0.1);
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(190, at); o.frequency.exponentialRampToValueAtTime(110, at + 0.08);
    const og = ctx.createGain(); og.gain.setValueAtTime(vol * 0.5, at); og.gain.exponentialRampToValueAtTime(0.001, at + 0.1);
    o.connect(og); og.connect(master); o.start(at); o.stop(at + 0.11);
  };
  let t = 0;
  while (t < dur) { const p = t / dur; tap(now + t, 0.1 + 0.6 * p * p); t += (0.11 - 0.07 * p) * (0.85 + Math.random() * 0.3); }
  const end = now + dur;
  const k = ctx.createOscillator(); k.type = 'sine'; k.frequency.setValueAtTime(140, end); k.frequency.exponentialRampToValueAtTime(40, end + 0.35);
  const kg = ctx.createGain(); kg.gain.setValueAtTime(1, end); kg.gain.exponentialRampToValueAtTime(0.001, end + 0.4);
  k.connect(kg); kg.connect(master); k.start(end); k.stop(end + 0.45);
  const c = ctx.createBufferSource(); c.buffer = buf;
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 4500;
  const cg = ctx.createGain(); cg.gain.setValueAtTime(0.7, end); cg.gain.exponentialRampToValueAtTime(0.001, end + 1.4);
  c.connect(hp); hp.connect(cg); cg.connect(master); c.start(end); c.stop(end + 1.5);
  setTimeout(() => { try { ctx.close(); } catch(e){} }, ms + 2400);
  return { stop(){ try { master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(0, ctx.currentTime, 0.03); setTimeout(() => { try { ctx.close(); } catch(e){} }, 300); } catch(e){} } };
}

/* ---------- auth ---------- */
async function signIn(){
  const prov = new GoogleAuthProvider();
  try { await signInWithPopup(auth, prov); }
  catch (e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') return signInWithRedirect(auth, prov);
    if (e.code === 'auth/unauthorized-domain') msg = 'This domain is not authorized yet. Add it in Firebase > Authentication > Settings > Authorized domains.';
    else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') msg = 'Sign-in failed. Please try again.';
    render();
  }
}

async function sendChat(role){

async function loadHome(){
  let list = []; try { list = JSON.parse(ls.get(mineKey()) || '[]'); } catch(e){}
  try { const d = await callRaw('GET', uPath('draws')); if (d) Object.entries(d).forEach(([s, v]) => { if (!list.some(x => x.sid === s)) list.push({sid: s, key: v.key, title: v.title, createdAt: v.createdAt}); }); } catch(e){}
  homeDraws = list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  render();
}

async function createSession(){
  const title = ($('#t').value || '').trim();
  const names = [...new Set(($('#n').value || '').split('\n').map(s => s.trim()).filter(Boolean))];
  if (!title) { msg = 'Please enter an event name.'; return render(); }
  if (names.length < 3) { msg = 'Please enter at least 3 different names.'; return render(); }
  busy = true; msg = '';
  try {
    const s = rnd(10), k = rnd(16), p = {}, createdAt = Date.now();
    names.forEach((n, i) => { p['p' + (i + 1)] = {name: n}; });
    await dbPut(s, {info: {title, date: ($('#d').value || '').trim(), budget: ($('#b').value || '').trim(), createdAt, adminHash: await sha(k), owner: uid}, p});
    let mine = []; try { mine = JSON.parse(ls.get(mineKey()) || '[]'); } catch(e){}
    mine.unshift({sid: s, key: k, title, createdAt}); ls.set(mineKey(), JSON.stringify(mine.slice(0, 50)));
    try { await callRaw('PUT', uPath('draws/' + s), {title, key: k, createdAt}); } catch(e){}
    busy = false; location.hash = 's=' + s + '&k=' + k; return;
  } catch (e) { msg = 'Could not save. Check the databaseURL and Rules, then try again.'; }
  busy = false; render();
}

async function claim(){
  const pid = pending; if (!pid) return;
  try {
    const fresh = await dbGet(sid + '/p') || {};
    if (Object.values(fresh).some(p => p.claimedBy === uid)) { pending = null; return load(true); }
    if (!fresh[pid] || fresh[pid].claimedBy) throw new Error('taken');
    await dbPatch(sid + '/p/' + pid, {claimedBy: uid, claimedName: myName(), claimedAt: Date.now()});
    await sleep(300);
    const chk = await dbGet(sid + '/p/' + pid);
    if (!chk || chk.claimedBy !== uid) throw new Error('taken');
    msg = '';
  } catch (e) { msg = e.message === 'taken' ? 'Sorry, someone just claimed that name. Please pick another.' : 'Could not save. Please try again.'; }
  pending = null; await load(true);
}

async function performDraw(meId){
  const raw = await dbGet(sid + '/p') || {};
  const list = Object.entries(raw).map(([id, v]) => Object.assign({id}, v));
  const m = list.find(p => p.id === meId);
  if (m.drewAt) return;
  let picked = list.find(p => p.takenBy === uid);   /* resume if a previous attempt was interrupted */
  if (!picked) {
    const givers = list.filter(p => !p.drewAt && p.id !== m.id);
    const pool = list.filter(p => p.id !== m.id && !p.takenBy).filter(c => {
      const rr = list.filter(p => !p.takenBy && p.id !== c.id);
      return !(givers.length === 1 && rr.length === 1 && givers[0].id === rr[0].id);
    }).sort(() => Math.random() - .5);
    for (const c of pool) {
      const cur = await dbGet(sid + '/p/' + c.id);
      if (cur && cur.takenBy) continue;
      await dbPatch(sid + '/p/' + c.id, {takenBy: uid});
      await sleep(300);
      const chk = await dbGet(sid + '/p/' + c.id);
      if (chk && chk.takenBy === uid) { picked = c; break; }
    }
  }
  if (!picked) throw new Error('empty');
  await dbPatch(sid + '/p/' + m.id, {giftee: picked.id, drewAt: Date.now()});
}

const DRAW_QUOTES = [
  "Keep your friends close, and your enemies closer.",
  "Lord, kahit sino, huwag lang siya.",
  "Walang personalan, bunutan lang.",
  "May the bunot be with you."
];
async function draw(){
  const me = parts().find(p => p.claimedBy === uid);
  if (!me || me.drewAt) return;
  busy = true; msg = '';
  const dur = 5000 + Math.random() * 5000;           /* 5 to 10 seconds */
  const roll = drumRoll(dur);                          /* started inside the click, so audio is allowed */
  const names = parts().filter(p => p.id !== me.id).map(p => p.name);
  root.innerHTML = '<div class="card center"><div class="shake">' + giftSvg(72) + '</div><p class="mut" style="margin:8px 0 0">' + esc(DRAW_QUOTES[Math.floor(Math.random() * DRAW_QUOTES.length)]) + '</p><div class="big spin" id="shuf">...</div><div class="bar"><i id="prog" style="width:0"></i></div></div>';
  let err = null;
  const work = performDraw(me.id).catch(e => { err = e; });
  const t0 = Date.now();
  const iv = setInterval(() => {
    const s = $('#shuf'), p = $('#prog');
    if (s) s.textContent = names[Math.floor(Math.random() * names.length)] || '...';
    if (p) p.style.width = Math.min(100, (Date.now() - t0) / dur * 100) + '%';
  }, 80);
  while (Date.now() - t0 < dur && !err) await sleep(100);
  clearInterval(iv);
  if (err) roll.stop();
  await work;
  if (err) msg = err.message === 'empty' ? 'No names are available to draw right now. Please tell the draw creator.' : 'Could not save your pick. Please try again.';
  busy = false; await load(true);
}

async function release(pid){
  try {
    const cur = await dbGet(sid + '/p/' + pid);
    if (!cur || cur.drewAt) msg = 'This person has already drawn, so the name cannot be released.';
    else { await dbPatch(sid + '/p/' + pid, {claimedBy: null, claimedName: null, claimedAt: null}); msg = ''; }
  } catch (e) { msg = 'Could not release the name. Please try again.'; }
  await load(true);
}

async function addName(){
  const v = ($('#addn').value || '').trim(); if (!v) return;
  if (parts().some(p => p.name.toLowerCase() === v.toLowerCase())) { msg = 'That name is already on the list.'; return render(); }
  const n = parts().reduce((m, p) => Math.max(m, parseInt(p.id.slice(1)) || 0), 0) + 1;
  try { await dbPut(sid + '/p/p' + n, {name: v}); $('#addn').value = ''; msg = ''; } catch (e) { msg = 'Could not add the name. Please try again.'; }
  await load(true);
}

async function deleteDraw(){
  try {
    await dbDel(sid);
    try { await callRaw('DELETE', uPath('draws/' + sid)); } catch(e){}
    let mine = []; try { mine = JSON.parse(ls.get(mineKey()) || '[]'); } catch(e){}
    ls.set(mineKey(), JSON.stringify(mine.filter(m => m.sid !== sid)));
    confirmDel = false; location.href = baseUrl(); return;
  } catch (e) { msg = 'Could not delete the draw. Please try again.'; }
  confirmDel = false; render();
}

async function addWish(){
  const me = parts().find(p => p.claimedBy === uid); if (!me) return;
  const t = ($('#wt').value || '').trim().slice(0, 120);
  if (!t) { msg = 'Please describe the gift idea first.'; return render(); }
  if (wishItems(me).length >= 20) { msg = 'Your wishlist is full (20 items). Remove one to add another.'; return render(); }
  const id = 'w' + Date.now().toString(36) + rnd(3);
  try { await dbPut(sid + '/p/' + me.id + '/wishlist/' + id, {t, u: safeUrl($('#wu').value), at: Date.now()}); $('#wt').value = ''; $('#wu').value = ''; msg = ''; }
  catch (e) { msg = 'Could not save. Please try again.'; }
  await load(true);
}
async function delWish(id){
  const me = parts().find(p => p.claimedBy === uid); if (!me) return;
  try { await dbDel(sid + '/p/' + me.id + '/wishlist/' + id); msg = ''; } catch (e) { msg = 'Could not remove the item. Please try again.'; }
  await load(true);
}

function copy(id){
  const el = document.getElementById(id); if (!el) return;
  el.select();
  (navigator.clipboard ? navigator.clipboard.writeText(el.value) : Promise.reject()).catch(() => { try { document.execCommand('copy'); } catch(e){} });
  msg = 'Copied!'; render(); setTimeout(() => { msg = ''; render(); }, 1500);
}

root.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'tab') { tab = v; msg = ''; render(); }
  else if (a === 'signin') signIn();
  else if (a === 'signout') signOut(auth);
  else if (a === 'create') createSession();
  else if (a === 'pick') { pending = v; render(); }
  else if (a === 'unpick') { pending = null; render(); }
  else if (a === 'claim') claim();
  else if (a === 'draw') draw();
  else if (a === 'eye') { shown[v] = !shown[v]; render(); }
  else if (a === 'release') release(v);
  else if (a === 'add') addName();
  else if (a === 'copy') copy(v);
  else if (a === 'wadd') addWish();
  else if (a === 'wdel') delWish(v);
  else if (a === 'delask') { confirmDel = true; render(); }
  else if (a === 'delno') { confirmDel = false; render(); }
  else if (a === 'delyes') deleteDraw();
  else if (a === 'csend') sendChat(v);
});

root.addEventListener('keydown', e => { if (e.key === 'Enter' && /^cm[gr]$/.test(e.target.id)) { e.preventDefault(); sendChat(e.target.id.slice(2)); } });

/* ---------- load + poll ---------- */
async function load(force){
  if (!CONFIGURED || !user || !sid) return;
  try {
    const d = await dbGet(sid);
    if (!d || !d.info) { notFound = true; loaded = true; return render(); }
    notFound = false;
    const j = JSON.stringify(d);
    if (!force && j === lastJson && loaded) return;
    lastJson = j; ses = d; loaded = true;
    isAdmin = !!key && (await sha(key)) === d.info.adminHash;
    const ae = document.activeElement;
    if (ae && /^cm[gr]$/.test(ae.id)) { refreshChats(); return; }
    render();
  } catch (e) { if (!loaded) { msg = 'Cannot reach the database. Check the databaseURL, Rules, and your connection.'; loaded = true; ses = null; notFound = true; render(); } }
}

function boot(){
  readHash(); ses = null; loaded = false; notFound = false; lastJson = ''; pending = null; shown = {}; tab = 'dash'; msg = ''; confirmDel = false; homeDraws = null;
  render();
  if (user && sid) load(true); else if (user) loadHome();
}

if (CONFIGURED) {
  onAuthStateChanged(auth, u => { user = u; uid = u ? u.uid : null; authReady = true; boot(); });
  window.addEventListener('hashchange', boot);
  setInterval(() => { if (user && sid && !busy && !document.hidden && (!document.activeElement?.matches?.('input,textarea') || /^cm[gr]$/.test(document.activeElement.id))) load(false); }, 4000);
} else render();
</script>
